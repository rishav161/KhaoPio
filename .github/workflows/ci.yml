name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-checks:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

  frontend-checks:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine changed frontend files
        id: changed
        working-directory: .
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "${{ github.sha }}" -- frontend | grep -E '\.(ts|tsx)$' | sed 's#^frontend/##')
          {
            echo "files<<CHANGED_FILES_EOF"
            echo "$FILES"
            echo "CHANGED_FILES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed frontend files:"
          echo "$FILES"

      - name: Lint changed files only
        if: steps.changed.outputs.files != ''
        run: |
          mapfile -t FILES <<< "${{ steps.changed.outputs.files }}"
          ARGS=()
          for f in "${FILES[@]}"; do
            [[ -n "$f" ]] && ARGS+=("$f")
          done
          npx eslint "${ARGS[@]}"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.example.com/api

  deploy-backend:
    name: Deploy backend to Render
    needs: backend-checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
