name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-checks:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

  frontend-checks:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine changed frontend files
        id: changed
        working-directory: .
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "${{ github.sha }}" -- frontend | grep -E '\.(ts|tsx)$' | sed 's#^frontend/##')
          {
            echo "files<<CHANGED_FILES_EOF"
            echo "$FILES"
            echo "CHANGED_FILES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed frontend files:"
          echo "$FILES"

      - name: Lint changed files only
        if: steps.changed.outputs.files != ''
        run: |
          mapfile -t FILES <<< "${{ steps.changed.outputs.files }}"
          ARGS=()
          for f in "${FILES[@]}"; do
            [[ -n "$f" ]] && ARGS+=("$f")
          done
          npx eslint "${ARGS[@]}"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.example.com/api

  build-and-push:
    name: Build and push images to Docker Hub
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jyotiprakashb23
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: jyotiprakashb23/khaopio-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: jyotiprakashb23/khaopio-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://157.245.105.61:5000/api

  deploy-droplet:
    name: Deploy to DigitalOcean Droplet
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 157.245.105.61
          username: root
          key: ${{ secrets.DO_VM_SSH_KEY }}
          script: |
            cd ~/KhaoPio
            git pull
            docker compose pull
            docker compose up -d
