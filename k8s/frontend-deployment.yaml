apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: khaopio
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: khaopio-frontend:local
          imagePullPolicy: Never
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: khaopio
spec:
  selector: { app: frontend }
  ports:
    - port: 3000
      targetPort: 3000
