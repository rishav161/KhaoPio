apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: khaopio-ingress
  namespace: khaopio
spec:
  ingressClassName: nginx
  rules:
    - host: khaopio.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 5000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 3000 } }
